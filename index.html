<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINI MARKET - ახალციხე</title>
    <link rel="stylesheet" href="style.css">
</head>
    <link rel="manifest" href="manifest.json">
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <h1>MINI MARKET</h1>
        </div>
        <div class="header-actions">
            <a href="tel:+995500224822" class="phone-link">📞 +995 500 22 48 22</a>
            <div class="cart-icon" onclick="toggleCart()">
                🛒 <span class="cart-badge" id="cartCount">0</span>
            </div>
            <button class="btn btn-admin" onclick="openAdminModal()">ადმინი</button>
        </div>
    </header>

    <!-- Info Bar -->
    <div class="info-bar">
        <div>📍 ქ. ახალციხე, იაძის ქ. N2ი</div>
        <div>🕒 10:00 - 17:50</div>
        <div>🚚 უფასო მიწოდება 200₾-ზე ზემოთ!</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="controls">
            <input type="text" id="searchInput" placeholder="მოძებნე პროდუქტი..." oninput="renderProducts()">
            <select id="countryFilter" onchange="renderProducts()">
                <option value="ALL">ყველა ქვეყანა</option>
                <option value="საქართველო">საქართველო</option>
                <option value="სომხეთი">სომხეთი</option>
                <option value="თურქეთი">თურქეთი</option>
                <option value="უკრაინა">უკრაინა</option>
                <option value="ჩინეთი">ჩინეთი</option>
                <option value="რუსეთი">რუსეთი</option>
                <option value="სხვა">სხვა</option>
            </select>
        </div>

        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleCart()">&times;</span>
            <h2>🛒 თქვენი კალათა</h2>
            <br>
            <div id="cartItems"></div>
            <hr><br>
            <h3>სულ: <span id="cartTotal">0.00</span> ₾</h3>

            <div class="delivery-info">
                <b>🚚 მიწოდების ტარიფები:</b><br>
                • ახალციხე: 3-6 ₾<br>
                • სოფლები: 10-20 ₾<br>
                • 200 ₾+ : <b>უფასო</b>
            </div>

            <div class="form-group">
                <label>მისამართი / სოფელი:</label>
                <input type="text" id="orderAddress" placeholder="მაგ: იაძის ქ. N2 ან სოფ. ვალე">
            </div>
            <div class="form-group">
                <label>გადახდის მეთოდი:</label>
                <select id="paymentMethod">
                    <option value="card">💳 საბანკო ბარათით</option>
                    <option value="cash">💵 ნაღდი ანგარიშსწორება</option>
                </select>
            </div>
            <button class="btn" style="width: 100%;" onclick="checkout()">შეკვეთის გაფორმება</button>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div class="modal" id="adminLoginModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('adminLoginModal')">&times;</span>
            <h2>🔒 ადმინისტრირება</h2>
            <br>
            <div class="form-group">
                <label>პაროლი:</label>
                <input type="password" id="adminPassword" placeholder="****">
            </div>
            <button class="btn" style="width: 100%;" onclick="loginAdmin()">შესვლა</button>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div class="modal" id="adminPanelModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('adminPanelModal')">&times;</span>
            <h2>➕ პროდუქტის დამატება</h2>
            <br>
            <div class="form-group">
                <label>დასახელება:</label>
                <input type="text" id="prodName">
            </div>
            <div class="form-group">
                <label>ფასი (₾):</label>
                <input type="number" id="prodPrice" step="0.01">
            </div>
            <div class="form-group">
                <label>ფოტოს URL ბმული:</label>
                <input type="text" id="prodImg" placeholder="https://site.com/image.jpg">
            </div>
            <div class="form-group">
                <label>მწარმოებელი ქვეყანა:</label>
                <select id="prodCountry">
                    <option value="საქართველო">საქართველო</option>
                    <option value="სომხეთი">სომხეთი</option>
                    <option value="თურქეთი">თურქეთი</option>
                    <option value="უკრაინა">უკრაინა</option>
                    <option value="ჩინეთი">ჩინეთი</option>
                    <option value="რუსეთი">რუსეთი</option>
                    <option value="სხვა">სხვა</option>
                </select>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="prodHasPrize"> 🎁 ამოდის პრიზი (აქციაშია)
                </label>
            </div>
            <button class="btn" style="width: 100%;" onclick="addProduct()">დამატება</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="app.js"></script>
    <!-- AI ბოტის სკრიპტი -->
    <script src="bot.js"></script>
</body>
</html>
